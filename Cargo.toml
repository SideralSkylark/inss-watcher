[package]
name = "inss-watcher"
version = "0.1.0"
edition = "2024"

# Usage:
#   inss-watcher start           # run the daemon
#   inss-watcher ctl rescan      # send a command to a running daemon
#   inss-watcher ctl stop
#   inss-watcher ctl status

[[bin]]
name = "inss-watcher"
path = "src/main.rs"

[dependencies]
notify = "8.2.0"
pdf-extract = "0.10.0"
rusqlite = { version = "0.38.0", features = ["chrono"] }
regex = "1.12.2"
fancy-regex = "0.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
image = "0.25.9"
anyhow = "1.0.100"
dirs = "6.0.0"
tempfile = "3.24.0"
chrono = "0.4.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
ctrlc = "3.5.2"
lopdf = "0.40.0"
toml = "0.8"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
notify-rust = "4.7.0"
